.marquee-wrapper {
    position: relative;

.marquee-wrapper::before,
.marquee-wrapper::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    z-index: 2;
    pointer-events: none;
}
.marquee-wrapper::before {
    left: 0;
    background: linear-gradient(180deg, #000000 0%, rgba(0,0,0,0) 100%);
}
.marquee-wrapper::after {
    right: 0;
    background: linear-gradient(180deg, #000000 0%, rgba(0,0,0,0) 100%);
}

.marquee-box {
    background: linear-gradient(180deg, #ffffcc 70%, rgba(255,255,204,0) 100%);
